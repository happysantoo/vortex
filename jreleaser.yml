project:
  name: vortex
  version: 0.0.1
  description: A lightweight Java library for micro-batching requests to any backend with virtual threads support
  authors:
    - VajraPulse
  license: Apache-2.0
  copyright: "Copyright © 2025 VajraPulse"
  links:
    homepage: https://github.com/vajrapulse/vortex
    scm: https://github.com/vajrapulse/vortex
    documentation: https://github.com/vajrapulse/vortex
  java:
    groupId: com.vajrapulse

signing:
  active: ALWAYS
  armored: true

release:
  github:
    enabled: false

deploy:
  maven:
    mavenCentral:
      active: ALWAYS
      stage: FULL
      username: '{{mavenCentralUsername}}'
      password: '{{mavenCentralToken}}'
      retryDelay: 10
      maxRetries: 10
