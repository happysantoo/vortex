name: Build, Test, and Release

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Generate test coverage report
      run: ./gradlew jacocoTestReport --no-daemon
    
    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage-report
        path: build/reports/jacoco/test/html/index.html
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for tagging
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: Extract version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep 'version =' build.gradle.kts | sed 's/.*version = "\(.*\)".*/\1/')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Extracted version: ${VERSION}"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build and test
      run: ./gradlew clean build jacocoTestCoverageVerification --no-daemon
    
    - name: Publish to Maven Local
      run: ./gradlew publishToMavenLocal --no-daemon
    
    - name: Set up GPG for signing
      if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -n "$GPG_PRIVATE_KEY" ]; then
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG key imported"
        fi
    
    - name: Configure Maven Central credentials
      run: |
        mkdir -p ~/.gradle
        echo "mavenCentralToken=${{ secrets.MAVEN_CENTRAL_TOKEN }}" >> ~/.gradle/gradle.properties
        if [ -n "${{ secrets.GPG_KEY_ID }}" ]; then
          echo "signing.keyId=${{ secrets.GPG_KEY_ID }}" >> ~/.gradle/gradle.properties
        fi
        if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
          echo "signingKey<<EOF" >> ~/.gradle/gradle.properties
          echo "${{ secrets.GPG_PRIVATE_KEY }}" >> ~/.gradle/gradle.properties
          echo "EOF" >> ~/.gradle/gradle.properties
        fi
        if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
          echo "signingPassword=${{ secrets.GPG_PASSPHRASE }}" >> ~/.gradle/gradle.properties
        fi
    
    - name: Create git tag
      id: tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="v${VERSION}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping tag creation"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          git tag -a "$TAG" -m "Release $VERSION"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
    
    - name: Install GitHub CLI
      run: |
        type -p curl >/dev/null || (apt update && apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && apt update \
        && apt install gh -y
    
    - name: Authenticate GitHub CLI
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
    
    - name: Publish to Maven Central and create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        chmod +x scripts/publish-to-central.sh
        
        # Run publish script (it will create GitHub release at the end)
        ./scripts/publish-to-central.sh "$VERSION" || {
          echo "Publishing failed, but continuing..."
          exit 1
        }
    
    - name: Verify GitHub release
      if: steps.tag.outputs.tag_exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="${{ steps.tag.outputs.tag }}"
        
        # Wait a moment for release to be created
        sleep 5
        
        # Verify release exists
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "✓ GitHub release created successfully: $TAG"
          gh release view "$TAG"
        else
          echo "⚠ Warning: GitHub release may not have been created"
          echo "This is non-fatal - Maven Central upload may have succeeded"
          echo "You may need to create the release manually:"
          echo "  gh release create $TAG --title 'Release $VERSION' --notes-file documents/releases/RELEASE_NOTES_${VERSION}.md"
        fi

