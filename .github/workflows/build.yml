name: Build, Test, and Release

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Generate test coverage report
      run: ./gradlew jacocoTestReport --no-daemon
    
    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage-report
        path: build/reports/jacoco/test/html/index.html
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    permissions:
      contents: write  # Required for creating tags and releases
      id-token: write  # Required for OIDC if needed
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for tagging
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: Extract version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep 'version =' build.gradle.kts | sed 's/.*version = "\(.*\)".*/\1/')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Extracted version: ${VERSION}"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build and test
      run: ./gradlew clean build jacocoTestCoverageVerification --no-daemon
    
    - name: Publish to Maven Local
      run: ./gradlew publishToMavenLocal --no-daemon
    
    - name: Set up GPG for signing
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        echo "Debug: Checking GPG_PRIVATE_KEY..."
        if [ -n "$GPG_PRIVATE_KEY" ]; then
          GPG_LEN=$(echo -n "$GPG_PRIVATE_KEY" | wc -c)
          echo "GPG_PRIVATE_KEY is set (length: $GPG_LEN)"
        else
          echo "GPG_PRIVATE_KEY is not set or empty"
        fi
        
        if [ -z "$GPG_PRIVATE_KEY" ] || [ "$GPG_PRIVATE_KEY" = "" ]; then
          echo "GPG_PRIVATE_KEY not set, skipping GPG setup"
          exit 0
        fi
        
        # Check if the key looks like valid GPG data (starts with -----BEGIN)
        if ! echo "$GPG_PRIVATE_KEY" | grep -q "-----BEGIN"; then
          echo "GPG_PRIVATE_KEY does not appear to be valid GPG data, skipping GPG setup"
          exit 0
        fi
        
        # Create GPG directory and set permissions
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        
        # Import the key
        echo "Importing GPG key..."
        if ! echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1; then
          echo "ERROR: Failed to import GPG key"
          exit 1
        fi
        
        echo "GPG key imported successfully"
        
        # Get the key ID (either from secret or from imported key)
        if [ -n "$GPG_KEY_ID" ]; then
          KEY_ID="$GPG_KEY_ID"
          echo "Using provided GPG_KEY_ID: $KEY_ID"
        else
          # Extract key ID from imported key
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null | grep -E "^(sec|ssb)" | head -1 | sed -n 's/.*\/\([A-Z0-9]*\).*/\1/p')
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --keyid-format SHORT 2>/dev/null | grep -E "^(sec|ssb)" | head -1 | sed -n 's/.*\/\([A-Z0-9]*\).*/\1/p')
          fi
          echo "Extracted GPG key ID: $KEY_ID"
        fi
        
        if [ -z "$KEY_ID" ]; then
          echo "ERROR: Could not determine GPG key ID"
          exit 1
        fi
        
        # Trust the key (required for CI environments)
        # Use trust model always to avoid interactive prompts
        echo "Configuring GPG trust model..."
        mkdir -p ~/.gnupg
        echo "trust-model always" >> ~/.gnupg/gpg.conf
        chmod 600 ~/.gnupg/gpg.conf
        
        # Also set trust level for the specific key
        echo "Trusting GPG key $KEY_ID..."
        (echo "trust"; echo "5"; echo "y"; echo "quit") | gpg --batch --command-fd 0 --edit-key "$KEY_ID" 2>&1 || {
          echo "Note: Could not set trust interactively, using trust-model always"
        }
        
        # Verify the key is available and can be used
        echo "Verifying GPG key..."
        if gpg --list-secret-keys --keyid-format LONG 2>&1 | grep -q "$KEY_ID"; then
          echo "✓ GPG key $KEY_ID is available"
          
          # Test signing capability
          echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --sign --local-user "$KEY_ID" -o /dev/null 2>&1 && {
            echo "✓ GPG key $KEY_ID can sign successfully"
          } || {
            echo "⚠ Warning: GPG key signing test failed, but continuing..."
          }
        else
          echo "ERROR: GPG key $KEY_ID not found after import"
          gpg --list-secret-keys --keyid-format LONG
          exit 1
        fi
    
    - name: Configure Maven Central credentials
      env:
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      run: |
        mkdir -p ~/.gradle
        echo "Debug: Checking MAVEN_CENTRAL_TOKEN..."
        if [ -n "$MAVEN_CENTRAL_TOKEN" ]; then
          TOKEN_LEN=$(echo -n "$MAVEN_CENTRAL_TOKEN" | wc -c)
          echo "MAVEN_CENTRAL_TOKEN is set (length: $TOKEN_LEN)"
        else
          echo "MAVEN_CENTRAL_TOKEN is not set or empty"
        fi
        
        if [ -z "$MAVEN_CENTRAL_TOKEN" ] || [ "$MAVEN_CENTRAL_TOKEN" = "" ]; then
          echo "ERROR: MAVEN_CENTRAL_TOKEN secret is not set"
          exit 1
        fi
        echo "mavenCentralToken=$MAVEN_CENTRAL_TOKEN" >> ~/.gradle/gradle.properties
        if [ -n "$GPG_KEY_ID" ]; then
          echo "signing.keyId=$GPG_KEY_ID" >> ~/.gradle/gradle.properties
        fi
        if [ -n "$GPG_PRIVATE_KEY" ]; then
          {
            echo "signingKey<<EOF"
            echo "$GPG_PRIVATE_KEY"
            echo "EOF"
          } >> ~/.gradle/gradle.properties
        fi
        if [ -n "$GPG_PASSPHRASE" ]; then
          echo "signingPassword=$GPG_PASSPHRASE" >> ~/.gradle/gradle.properties
        fi
    
    - name: Create git tag
      id: tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="v${VERSION}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping tag creation"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          git tag -a "$TAG" -m "Release $VERSION"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
    
    - name: Install GitHub CLI
      run: |
        type -p curl >/dev/null || sudo apt update && sudo apt install curl -y
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y
    
    - name: Authenticate GitHub CLI
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
    
    - name: Publish to Maven Central and create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        chmod +x scripts/publish-to-central.sh
        
        # Run publish script (it will create GitHub release at the end)
        ./scripts/publish-to-central.sh "$VERSION" || {
          echo "Publishing failed, but continuing..."
          exit 1
        }
    
    - name: Verify GitHub release
      if: steps.tag.outputs.tag_exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="${{ steps.tag.outputs.tag }}"
        
        # Wait a moment for release to be created
        sleep 5
        
        # Verify release exists
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "✓ GitHub release created successfully: $TAG"
          gh release view "$TAG"
        else
          echo "⚠ Warning: GitHub release may not have been created"
          echo "This is non-fatal - Maven Central upload may have succeeded"
          echo "You may need to create the release manually:"
          echo "  gh release create $TAG --title 'Release $VERSION' --notes-file documents/releases/RELEASE_NOTES_${VERSION}.md"
        fi

