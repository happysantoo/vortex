name: Deploy Benchmark Reports to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'src/jmh/**'
      - 'build.gradle.kts'
  workflow_dispatch: # Allow manual triggering

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build benchmarks and generate HTML report
  build-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build project for benchmarks
      run: ./gradlew build --no-daemon -x test -x jacocoTestReport -x jacocoTestCoverageVerification

    - name: Run JMH benchmarks
      run: ./gradlew jmh --no-daemon
      continue-on-error: true

    - name: Generate JMH HTML report
      run: ./gradlew jmhReport --no-daemon
      continue-on-error: true

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/reports/jmh/html

  # Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-benchmarks
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display Pages URL
        run: |
          echo "## 📊 Benchmark Reports Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark reports have been published to GitHub Pages:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[View Benchmark Reports](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The reports will be automatically updated on every push to main branch." >> $GITHUB_STEP_SUMMARY