task checkCredentials {
    doLast {
        println "mavenCentralUsername: ${project.findProperty('mavenCentralUsername') ?: 'NOT FOUND'}"
        println "mavenCentralPassword: ${project.findProperty('mavenCentralPassword') ? '***' : 'NOT FOUND'}"
        println "signingKey: ${project.findProperty('signingKey') ? '***' : 'NOT FOUND'}"
        println "signingPassword: ${project.findProperty('signingPassword') ? '***' : 'NOT FOUND'}"
    }
}
